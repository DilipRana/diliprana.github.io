<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060a">
<title>APOD Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --scrim: rgba(8,10,14,0.5);
    --border: rgba(255,255,255,0.14);
    --text: #F5F3EE;
    --text-muted: rgba(245,243,238,0.6);
    --accent: #F2C879;
    --accent-glow: rgba(242,200,121,0.35);
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#05060a;
    font-family: var(--font-mono);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior:none;
  }

  /* ---------- fullscreen crossfading wallpaper layers ---------- */
  .bg-layer{
    position:fixed; inset:0;
    background-color:#05060a;
    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;
    opacity:0;
    transition: opacity 1.4s ease;
    will-change:opacity;
  }
  .bg-layer.active{ opacity:1; }

  body.idle{ cursor:none; }

  /* ---------- viewfinder corner brackets (signature detail) ---------- */
  .bracket{
    position:fixed; width:26px; height:26px;
    border-color: rgba(245,243,238,0.5);
    border-style:solid; border-width:0;
    opacity:0; transition: opacity .6s ease;
    pointer-events:none; z-index:5;
  }
  body.controls-visible .bracket{ opacity:1; }
  .bracket-tl{ top: calc(20px + env(safe-area-inset-top)); left: calc(20px + env(safe-area-inset-left)); border-top-width:2px; border-left-width:2px; }
  .bracket-tr{ top: calc(20px + env(safe-area-inset-top)); right: calc(20px + env(safe-area-inset-right)); border-top-width:2px; border-right-width:2px; }
  .bracket-bl{ bottom: calc(20px + env(safe-area-inset-bottom)); left: calc(20px + env(safe-area-inset-left)); border-bottom-width:2px; border-left-width:2px; }
  .bracket-br{ bottom: calc(20px + env(safe-area-inset-bottom)); right: calc(20px + env(safe-area-inset-right)); border-bottom-width:2px; border-right-width:2px; }

  /* ---------- HUD caption (image title / date) ---------- */
  .hud-caption{
    position:fixed;
    left: calc(28px + env(safe-area-inset-left));
    bottom: calc(28px + env(safe-area-inset-bottom));
    max-width:min(520px, 60vw);
    opacity:0; transform: translateY(6px);
    transition: opacity .6s ease, transform .6s ease;
    pointer-events:none; z-index:5;
    text-shadow: 0 1px 14px rgba(0,0,0,0.85);
  }
  body.controls-visible .hud-caption{ opacity:1; transform:translateY(0); }
  .hud-caption.pinned{ opacity:1; transform:translateY(0); }
  .hud-meta{ font-size:11px; letter-spacing:.16em; color:var(--accent); text-transform:uppercase; margin-bottom:6px; }
  .hud-title{ font-size:13px; letter-spacing:.02em; color:var(--text); line-height:1.5; font-weight:500; }

  /* ---------- control pill ---------- */
  .controls{
    position:fixed; left:50%;
    bottom: calc(30px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(10px);
    display:flex; gap:8px; padding:8px;
    border-radius:999px;
    background:var(--scrim);
    border:1px solid var(--border);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    opacity:0; pointer-events:none;
    transition: opacity .5s ease, transform .5s ease;
    z-index:10;
  }
  body.controls-visible .controls{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }

  .ctrl-btn{
    display:flex; align-items:center; gap:8px;
    padding:11px 20px; border-radius:999px;
    border:1px solid transparent;
    background:transparent; color:var(--text);
    font-family:var(--font-mono); font-size:12px;
    letter-spacing:.12em; font-weight:500;
    cursor:pointer;
    transition: background .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .ctrl-btn svg{ width:14px; height:14px; flex-shrink:0; }
  .ctrl-btn:hover, .ctrl-btn:focus-visible{ background: rgba(255,255,255,0.08); border-color: var(--border); }
  .ctrl-btn:active{ transform: scale(0.96); }
  .ctrl-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .ctrl-btn.is-on{ color:#05060a; background:var(--accent); border-color:var(--accent); }
  .ctrl-btn.is-on:hover{ box-shadow:0 0 24px var(--accent-glow); }
  .ctrl-btn[disabled]{ opacity:.45; cursor:default; pointer-events:none; }

  /* ---------- autoplay interval field ---------- */
  .timer-field{
    display:flex; align-items:center; gap:8px;
    padding:0 14px; border-radius:999px;
    border:1px solid var(--border);
    color:var(--text-muted);
    font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    cursor:text;
  }
  .timer-field input{
    width:54px; padding:6px 4px;
    background:transparent; color:var(--text);
    border:0; border-bottom:1px solid var(--border);
    font-family:var(--font-mono); font-size:12px; font-weight:500;
    text-align:center;
    -moz-appearance:textfield; appearance:textfield;
    -webkit-user-select:text; user-select:text;
  }
  .timer-field input::-webkit-outer-spin-button,
  .timer-field input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .timer-field input:focus{ outline:none; border-bottom-color:var(--accent); color:var(--accent); }

  /* ---------- loading screen ---------- */
  .loading-screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#05060a; z-index:20;
    transition: opacity .6s ease, visibility .6s ease;
  }
  .loading-screen.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .loading-text{ font-size:12px; letter-spacing:.3em; color:var(--text-muted); text-transform:uppercase; }
  .dots span{ opacity:0; animation: dotFade 1.4s infinite; }
  .dots span:nth-child(2){ animation-delay:.2s; }
  .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes dotFade{ 0%,80%,100%{ opacity:0; } 40%{ opacity:1; } }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; top: calc(28px + env(safe-area-inset-top)); left:50%;
    transform: translateX(-50%) translateY(-12px);
    background:var(--scrim); border:1px solid var(--border);
    backdrop-filter: blur(16px);
    color:var(--text); font-size:11px; letter-spacing:.08em;
    padding:10px 16px; border-radius:8px;
    opacity:0; pointer-events:none;
    transition: opacity .4s ease, transform .4s ease;
    z-index:30; text-transform:uppercase; text-align:center;
    max-width:80vw;
  }
  .toast.visible{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
  }

  @media (max-width:480px){
    .controls{ gap:6px; }
    .ctrl-btn{ padding:10px 14px; font-size:11px; }
    .hud-caption{ max-width:75vw; }
  }
</style>
</head>
<body>

  <div id="bg-a" class="bg-layer active"></div>
  <div id="bg-b" class="bg-layer"></div>

  <div class="bracket bracket-tl"></div>
  <div class="bracket bracket-tr"></div>
  <div class="bracket bracket-bl"></div>
  <div class="bracket bracket-br"></div>

  <div id="hud-caption" class="hud-caption">
    <div class="hud-meta" id="hud-date"></div>
    <div class="hud-title" id="hud-title"></div>
  </div>

  <div id="loading-screen" class="loading-screen">
    <div class="loading-text">ACQUIRING SIGNAL<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="controls" class="controls" role="toolbar" aria-label="Wallpaper controls">
    <button id="next-btn" class="ctrl-btn" type="button" aria-label="Next image">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,5 15,12 5,19"/><rect x="17" y="5" width="2.4" height="14" rx="1"/></svg>
      <span id="next-label">NEXT</span>
    </button>
    <button id="play-btn" class="ctrl-btn" type="button" aria-pressed="false" aria-label="Play slideshow">
      <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>
      <span id="play-label">PLAY</span>
    </button>
    <label class="timer-field" for="interval-input" title="Minutes between automatic image changes">
      <span>EVERY</span>
      <input id="interval-input" type="number" inputmode="numeric" min="1" max="1440" step="1" value="60" aria-label="Autoplay interval in minutes">
      <span>MIN</span>
    </label>
    <button id="info-btn" class="ctrl-btn" type="button" aria-pressed="false" aria-label="Keep description visible">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11.1" y="10.3" width="1.8" height="6" rx=".5"/><rect x="11.1" y="6.9" width="1.8" height="1.8" rx=".5"/></svg>
      <span>INFO</span>
    </button>
  </div>

<script>
(() => {
  'use strict';

  // ---- Config ----------------------------------------------------------
  // DEMO_KEY works out of the box but is rate-limited (~30 req/hr, 50/day).
  // Get a free personal key at https://api.nasa.gov and swap it in below
  // for heavier use.
  const NASA_API_KEY = 'DEMO_KEY';
  const APOD_ENDPOINT = 'https://api.nasa.gov/planetary/apod';
  const DEFAULT_INTERVAL_MIN = 60;  // autoplay default; editable from the control bar
  const MIN_INTERVAL_MIN = 1;
  const MAX_INTERVAL_MIN = 1440;    // 24 hours
  const IDLE_DELAY_MS = 2600;
  const BATCH_SIZE = 12;            // random entries requested per API call
  const FETCH_TIMEOUT_MS = 12000;   // give up on a stalled NASA data request
  const IMAGE_TIMEOUT_MS = 25000;   // give up on a stalled image download
  const WATCHDOG_MS = 70000;        // absolute cap on one "load next image" attempt
  const POOL_LOW_WATER = 3;        // top up the pool in the background below this
  const SEEN_LIMIT = 400;           // remember this many recent picks to avoid repeats
  const HISTORY_KEY = 'apodHistory';
  const HISTORY_LIMIT = 100;        // saved images to fall back on when offline / rate-limited
  // NASA Image and Video Library: no API key needed, used when APOD is unavailable
  const LIB_ENDPOINT = 'https://images-api.nasa.gov/search';
  const LIB_QUERIES = ['nebula', 'galaxy', 'earth from space', 'aurora', 'supernova', 'hubble', 'webb telescope',
    'mars surface', 'jupiter', 'saturn', 'moon', 'milky way', 'star cluster', 'comet', 'solar flare',
    'space station', 'eclipse', 'andromeda', 'orion', 'black hole', 'pillars of creation', 'cosmos'];

  // ---- Elements ----------------------------------------------------------
  const layers = [document.getElementById('bg-a'), document.getElementById('bg-b')];
  let activeIndex = 0;
  const loadingScreen = document.getElementById('loading-screen');
  const hudDate = document.getElementById('hud-date');
  const hudTitle = document.getElementById('hud-title');
  const toastEl = document.getElementById('toast');
  const nextBtn = document.getElementById('next-btn');
  const nextLabel = document.getElementById('next-label');
  const playBtn = document.getElementById('play-btn');
  const playIcon = document.getElementById('play-icon');
  const playLabel = document.getElementById('play-label');
  const infoBtn = document.getElementById('info-btn');
  const hudCaption = document.getElementById('hud-caption');
  const intervalInput = document.getElementById('interval-input');

  // ---- State ----------------------------------------------------------
  let isFetching = false;
  let isPlaying = false;
  let isInfoPinned = false;
  let playTimer = null;
  let toastTimer = null;
  let intervalMin = DEFAULT_INTERVAL_MIN;
  let isTopUp = false;
  const pool = [];            // prefetched random entries waiting to be shown
  const seen = new Set();     // ids already shown this visit

  // Persist the interval between visits (storage can be blocked, so guard it)
  function loadInterval() {
    try {
      const saved = parseInt(localStorage.getItem('apodIntervalMin'), 10);
      if (saved >= MIN_INTERVAL_MIN && saved <= MAX_INTERVAL_MIN) return saved;
    } catch (_) {}
    return DEFAULT_INTERVAL_MIN;
  }
  function saveInterval(v) {
    try { localStorage.setItem('apodIntervalMin', String(v)); } catch (_) {}
  }

  // Inner shapes only — #play-icon is already an <svg> element in the DOM
  const SHAPE_PLAY = '<polygon points="8,5 19,12 8,19"/>';
  const SHAPE_PAUSE = '<rect x="6" y="5" width="4.2" height="14" rx="1"/><rect x="13.8" y="5" width="4.2" height="14" rx="1"/>';

  // ---- Toast ----------------------------------------------------------
  function showToast(message, duration = 3200) {
    clearTimeout(toastTimer);
    toastEl.textContent = message;
    toastEl.classList.add('visible');
    toastTimer = setTimeout(() => toastEl.classList.remove('visible'), duration);
  }

  // ---- Image sources -----------------------------------------------------
  // Every source produces entries shaped { id, label, title, urls[] } where
  // urls are tried in order (best quality first).
  //   1. APOD     – api.nasa.gov, random batch (needs key; DEMO_KEY has a hard daily cap)
  //   2. Library  – images-api.nasa.gov, no key and no meaningful rate limit
  //   3. History  – images shown before, saved in localStorage (repeats are fine)
  // If one source fails, the next takes over, so Next never "does nothing".
  let apodBlockedUntil = 0;   // after an APOD failure, skip it for a while
  let currentId = null;       // never pick the image already on screen
  let currentUrl = null;
  let history = loadHistory();

  function loadHistory() {
    try {
      const h = JSON.parse(localStorage.getItem(HISTORY_KEY));
      return Array.isArray(h) ? h : [];
    } catch (_) { return []; }
  }
  function remember(entry) {
    history = history.filter(h => h.id !== entry.id);
    history.push(entry);
    if (history.length > HISTORY_LIMIT) history.shift();
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (_) {}
  }

  function addToPool(entries) {
    const inBatch = new Set();
    let added = 0;
    for (const e of entries) {
      if (!e || !e.urls.length) continue;
      if (e.id === currentId || seen.has(e.id) || inBatch.has(e.id) || pool.some(p => p.id === e.id)) continue;
      inBatch.add(e.id);
      pool.push(e);
      added++;
    }
    return added;
  }

  async function getJson(url) {
    // Abort stalled requests: a hung connection must never freeze the page
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
    try {
      // cache:'no-store' stops the browser replaying an earlier "random" response
      const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
      if (!res.ok) {
        const err = new Error(`HTTP ${res.status}`);
        err.status = res.status;
        throw err;
      }
      return await res.json();
    } catch (err) {
      if (err.name === 'AbortError') throw new Error('NASA took too long to respond');
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  // Source 1: one call returns BATCH_SIZE random pictures from 1995 → today
  async function fillFromApod() {
    const data = await getJson(
      `${APOD_ENDPOINT}?api_key=${encodeURIComponent(NASA_API_KEY)}&count=${BATCH_SIZE}`
    );
    const entries = (Array.isArray(data) ? data : [])
      .filter(e => e && e.media_type === 'image' && (e.hdurl || e.url))
      .map(e => ({
        id: 'apod-' + e.date,
        label: 'APOD · ' + e.date,
        title: e.title || '',
        urls: [...new Set([e.hdurl, e.url].filter(Boolean))],
      }));
    return addToPool(entries);
  }

  // Source 2: NASA Image and Video Library – random search term + random page
  async function fillFromLibrary() {
    const q = LIB_QUERIES[Math.floor(Math.random() * LIB_QUERIES.length)];
    const build = page => `${LIB_ENDPOINT}?q=${encodeURIComponent(q)}&media_type=image&page_size=30&page=${page}`;
    let data;
    try {
      data = await getJson(build(1 + Math.floor(Math.random() * 12)));
    } catch (err) {
      data = await getJson(build(1)); // that page may not exist for a narrow term
    }
    const items = (data && data.collection && data.collection.items) || [];
    const entries = items.map(it => {
      const d = (it.data && it.data[0]) || {};
      const thumb = it.links && it.links[0] && it.links[0].href;
      if (!thumb || d.media_type !== 'image' || !d.nasa_id) return null;
      const base = thumb.replace(/ /g, '%20');
      return {
        id: 'lib-' + d.nasa_id,
        label: 'NASA IMAGE LIBRARY' + (d.date_created ? ' · ' + d.date_created.slice(0, 4) : ''),
        title: d.title || '',
        // larger renditions usually exist; fall back to the thumbnail if not
        urls: [base.replace('~thumb.', '~large.'), base.replace('~thumb.', '~medium.'), base],
      };
    }).filter(Boolean);
    return addToPool(entries);
  }

  async function refillPool({ loud = false } = {}) {
    if (Date.now() >= apodBlockedUntil) {
      try {
        await fillFromApod();
      } catch (err) {
        console.warn('APOD unavailable:', err.message);
        // 429 = out of quota (wait longer); anything else = try again soon
        apodBlockedUntil = Date.now() + (err.status === 429 ? 30 : 2) * 60 * 1000;
        if (loud) showToast(err.status === 429 ? 'APOD limit reached — using NASA Image Library' : 'APOD unavailable — using NASA Image Library');
      }
    }
    if (pool.length === 0) {
      try { await fillFromLibrary(); }
      catch (err) { console.warn('NASA Image Library unavailable:', err.message); }
    }
  }

  function takeFromPool() {
    const i = Math.floor(Math.random() * pool.length);
    const [entry] = pool.splice(i, 1);
    seen.add(entry.id);
    if (seen.size > SEEN_LIMIT) seen.delete(seen.values().next().value); // drop oldest
    return entry;
  }

  // Quietly refill in the background so the next click is instant
  async function topUpPool() {
    if (isTopUp || pool.length >= POOL_LOW_WATER) return;
    isTopUp = true;
    try { await refillPool(); } catch (_) {}
    isTopUp = false;
  }

  async function fetchNext() {
    if (pool.length === 0) await refillPool({ loud: true });
    if (pool.length > 0) {
      const entry = takeFromPool();
      topUpPool();
      return entry;
    }
    // Both live sources failed: reuse something shown before (never the current one)
    const older = history.filter(h => h.id !== currentId);
    if (older.length > 0) {
      showToast('Offline or rate-limited — showing a saved image');
      return older[Math.floor(Math.random() * older.length)];
    }
    throw new Error('Could not reach NASA — check your connection and try again');
  }

  // ---- Preload then crossfade a new background in ----
  function preloadImage(url) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const timer = setTimeout(() => {
        img.onload = img.onerror = null;
        img.src = ''; // cancel the stalled download
        reject(new Error('Image took too long to load'));
      }, IMAGE_TIMEOUT_MS);
      img.onload = () => { clearTimeout(timer); resolve(url); };
      img.onerror = () => { clearTimeout(timer); reject(new Error('Image failed to load')); };
      img.src = url;
    });
  }

  function paintLayer(url) {
    const next = layers[1 - activeIndex];
    const current = layers[activeIndex];
    next.style.backgroundImage = `url("${url.replace(/["\\\n]/g, encodeURIComponent)}")`;
    next.classList.add('active');
    current.classList.remove('active');
    activeIndex = 1 - activeIndex;
  }

  function updateCaption(entry) {
    hudDate.textContent = entry.label || '';
    hudTitle.textContent = entry.title || '';
  }

  // ---- Advance to a new random wallpaper ----
  let loadToken = 0; // lets a timed-out attempt be ignored if it finishes late

  async function loadNextImage(token) {
    let lastErr = null;
    // If a picked image fails to load, try its other sizes, then another image
    for (let i = 0; i < 5; i++) {
      const entry = await fetchNext();
      for (const url of entry.urls) {
        if (url === currentUrl) continue; // never "change" to the image already showing
        try {
          await preloadImage(url);
        } catch (err) {
          console.warn('Skipping image:', url, err.message);
          lastErr = err;
          continue;
        }
        if (token !== loadToken) return;   // a newer attempt took over; drop this one
        paintLayer(url);
        updateCaption(entry);
        currentId = entry.id;
        currentUrl = url;
        remember(entry);
        return;
      }
    }
    throw lastErr || new Error('Could not load a new image');
  }

  async function showNextImage() {
    if (isFetching) return;
    isFetching = true;
    const token = ++loadToken;
    nextBtn.setAttribute('disabled', 'true');
    nextLabel.textContent = 'LOADING';
    let watchdog;
    try {
      // Backstop: whatever goes wrong, give up after WATCHDOG_MS so Next never stays dead
      await Promise.race([
        loadNextImage(token),
        new Promise((_, reject) => {
          watchdog = setTimeout(() => reject(new Error('Timed out loading an image — try Next again')), WATCHDOG_MS);
        }),
      ]);
    } catch (err) {
      loadToken++; // invalidate the abandoned attempt
      console.error(err);
      showToast(err.message || 'Could not load a new image');
    } finally {
      clearTimeout(watchdog);
      loadingScreen.classList.add('hidden');
      isFetching = false;
      nextBtn.removeAttribute('disabled');
      nextLabel.textContent = 'NEXT';
    }
  }

  // ---- Play / pause (hourly auto-advance) ----
  function setPlaying(playing) {
    isPlaying = playing;
    playBtn.classList.toggle('is-on', playing);
    playBtn.setAttribute('aria-pressed', String(playing));
    playBtn.setAttribute('aria-label', playing ? 'Pause slideshow' : 'Play slideshow');
    playIcon.innerHTML = playing ? SHAPE_PAUSE : SHAPE_PLAY;
    playLabel.textContent = playing ? 'PAUSE' : 'PLAY';
    startTimer();
  }

  // (Re)start the autoplay timer using the current interval; no-op when paused
  function startTimer() {
    clearInterval(playTimer);
    playTimer = isPlaying ? setInterval(showNextImage, intervalMin * 60 * 1000) : null;
  }

  function applyInterval(raw, { commit = false } = {}) {
    const n = Math.round(Number(raw));
    if (!Number.isFinite(n) || n < MIN_INTERVAL_MIN) {
      if (commit) intervalInput.value = intervalMin; // reject junk, restore last good value
      return;
    }
    intervalMin = Math.min(n, MAX_INTERVAL_MIN);
    saveInterval(intervalMin);
    startTimer(); // changing it while playing restarts the countdown
    if (commit) {
      intervalInput.value = intervalMin;
      if (isPlaying) showToast(`Autoplay every ${intervalMin} min`, 2000);
    }
  }

  intervalInput.addEventListener('input', () => applyInterval(intervalInput.value));
  intervalInput.addEventListener('change', () => applyInterval(intervalInput.value, { commit: true }));
  intervalInput.addEventListener('keydown', (e) => {
    e.stopPropagation(); // typing digits must not trigger N / I / Space shortcuts
    revealControls();    // ...but keep the bar visible while editing
    if (e.key === 'Enter') intervalInput.blur();
  });

  // ---- Keep description visible (instead of only showing it on movement) ----
  function setInfoPinned(pinned) {
    isInfoPinned = pinned;
    infoBtn.classList.toggle('is-on', pinned);
    infoBtn.setAttribute('aria-pressed', String(pinned));
    infoBtn.setAttribute('aria-label', pinned ? 'Only show description on hover' : 'Keep description visible');
    hudCaption.classList.toggle('pinned', pinned);
  }

  nextBtn.addEventListener('click', showNextImage);
  playBtn.addEventListener('click', () => setPlaying(!isPlaying));
  infoBtn.addEventListener('click', () => setInfoPinned(!isInfoPinned));

  // ---- Idle detection: reveal controls on movement, fade after stillness ----
  let idleTimer = null;
  function revealControls() {
    document.body.classList.add('controls-visible');
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      document.body.classList.remove('controls-visible');
      document.body.classList.add('idle');
    }, IDLE_DELAY_MS);
  }
  ['mousemove', 'mousedown', 'touchstart', 'wheel'].forEach(evt =>
    window.addEventListener(evt, revealControls, { passive: true })
  );

  // ---- Keyboard shortcuts: space = play/pause, → or N = next ----
  window.addEventListener('keydown', (e) => {
    revealControls();
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!isPlaying); }
    else if (e.code === 'ArrowRight' || e.key.toLowerCase() === 'n') showNextImage();
    else if (e.key.toLowerCase() === 'i') setInfoPinned(!isInfoPinned);
  });

  // ---- Double-click / double-tap toggles native fullscreen ----
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  }
  window.addEventListener('dblclick', toggleFullscreen);
  let lastTap = 0;
  window.addEventListener('touchend', () => {
    const now = Date.now();
    if (now - lastTap < 300) toggleFullscreen();
    lastTap = now;
  });

  // ---- Boot ----
  intervalMin = loadInterval();
  intervalInput.value = intervalMin;
  revealControls();
  showNextImage();
})();
</script>
</body>
</html>
